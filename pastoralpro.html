<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PastoralFlow Pro</title>
    
    <!-- PWA / Mobile Capable Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563EB">
    <meta name="application-name" content="PastoralFlow">
    <meta name="apple-mobile-web-app-title" content="PastoralFlow">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐑</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 style=%22background:white;%22><text y=%22.9em%22 font-size=%2290%22>🐑</text></svg>">

    <style>
        /* * ===============================================
         * SYNTHWEAVER DESIGN SYSTEM 2.0 (Neuro-Optimized)
         * ===============================================
         */
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --primary-light: #EFF6FF;
            --accent: #F59E0B;
            --success: #10B981;
            --danger: #EF4444;
            --surface: #FFFFFF;
            --background: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1F2937;
                --background: #111827;
                --text-main: #F9FAFB;
                --text-muted: #9CA3AF;
                --border: #374151;
                --primary-light: #1e3a8a;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* App-like feel */
        }

        /* --- LAYOUT --- */
        header {
            background: var(--surface);
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            box-shadow: var(--shadow);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.25rem; margin: 0; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        #app-view {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: calc(80px + var(--safe-area-bottom));
            scroll-behavior: smooth;
        }

        /* --- NAVIGATION --- */
        nav {
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            padding-bottom: max(0.5rem, var(--safe-area-bottom));
            position: fixed; bottom: 0; width: 100%;
            z-index: 30;
        }

        .nav-btn {
            background: none; border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-btn svg { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-btn.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }

        /* --- COMPONENTS --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-size: 1rem;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; }

        .fab {
            position: fixed; bottom: calc(90px + var(--safe-area-bottom)); right: 20px;
            width: 56px; height: 56px;
            background: var(--primary); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            z-index: 25; border: none; cursor: pointer;
        }

        /* --- FORMS --- */
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-main);
            font-size: 16px; /* Prevents zoom on iOS */
            margin-bottom: 1rem;
        }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }

        /* --- LISTS --- */
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .list-item:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
        .list-item:last-child { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); border-bottom: none; }
        
        .tag { padding: 2px 8px; border-radius: 100px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .tag-red { background: #FEE2E2; color: var(--danger); }
        .tag-green { background: #D1FAE5; color: var(--success); }
        .tag-blue { background: var(--primary-light); color: var(--primary); }

        /* --- TABS --- */
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1rem; }
        .tab { white-space: nowrap; padding: 6px 16px; border-radius: 20px; background: var(--border); font-size: 0.9rem; border: none; color: var(--text-muted); cursor: pointer; }
        .tab.active { background: var(--text-main); color: var(--surface); }

        /* --- MODAL --- */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 100;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--surface);
            width: 90%; max-width: 500px;
            max-height: 85vh; overflow-y: auto;
            border-radius: var(--radius);
            padding: 1.5rem;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none; }

    </style>
</head>
<body>

    <header>
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 3v18"></path><path d="M12 8l4.2 2.8a2.1 2.1 0 0 1 0 3.6L12 17"></path></svg>
            PastoralFlow <span style="font-size:0.5em; opacity:0.7; background:var(--primary-light); padding:2px 5px; border-radius:4px;">PRO</span>
        </h1>
        <button class="btn-sm btn-outline" onclick="app.showSettings()">⚙️</button>
    </header>

    <div id="app-view">
        <!-- Content injects here -->
    </div>

    <!-- FAB -->
    <button id="fab" class="fab" onclick="app.handleFab()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <nav>
        <button class="nav-btn active" onclick="app.navigate('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Hoy
        </button>
        <button class="nav-btn" onclick="app.navigate('members')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Ovejas
        </button>
        <button class="nav-btn" onclick="app.navigate('messages')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Mensajes
        </button>
        <button class="nav-btn" onclick="app.navigate('groups')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            Grupos
        </button>
    </nav>

    <!-- GENERIC MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <h2 id="modal-title" style="margin:0;">Título</h2>
                <button onclick="app.closeModal()" style="background:none; border:none; font-size:1.2rem;">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        /**
         * PASTORAL FLOW CORE ENGINE
         * Diseñado para performance, flexibilidad y cero dependencias.
         */
        
        const DB_NAME = 'pastoralflow_pro_db';
        
        // --- 1. SEED DATA (El gran banco de 160+ mensajes) ---
        const SEED_DATA = {
            members: [],
            groups: [
                { id: 'g1', name: 'Jóvenes' },
                { id: 'g2', name: 'Matrimonios' },
                { id: 'g3', name: 'Damas' },
                { id: 'g4', name: 'Varones' },
                { id: 'g5', name: 'Liderazgo' },
                { id: 'g6', name: 'Nuevos Creyentes' },
                { id: 'g7', name: 'General' }
            ],
            // Mensajes como objetos para ser editables
            messages: [] 
        };

        // Función para generar los 160 mensajes si no existen
        function generateSeedMessages() {
            const msgs = [];
            const add = (cat, text) => msgs.push({ id: 'msg_'+Date.now()+Math.random(), cat, text });

            // 30 Bíblicos
            const versiculos = [
                "Josué 1:9 - Esfuérzate y sé valiente.", "Jeremías 29:11 - Planes de bienestar.", "Filipenses 4:13 - Todo lo puedo en Cristo.",
                "Salmos 23:1 - Jehová es mi pastor.", "Isaías 40:31 - Nuevas fuerzas.", "Romanos 8:28 - Todo ayuda a bien.",
                "Salmos 91:1 - Al abrigo del Altísimo.", "Proverbios 3:5 - Fíate de Jehová.", "Mateo 11:28 - Venid a mí los cansados.",
                "Salmos 121:1 - Mi socorro viene de Jehová.", "2 Timoteo 1:7 - No espíritu de cobardía.", "Isaías 41:10 - No temas, yo estoy contigo.",
                "Salmos 37:4 - Deléitate en Jehová.", "Lamentaciones 3:23 - Nuevas son sus misericordias.", "Juan 3:16 - De tal manera amó Dios al mundo.",
                "Efesios 2:8 - Por gracia sois salvos.", "Gálatas 2:20 - Con Cristo estoy juntamente crucificado.", "1 Juan 4:4 - Mayor es el que está en vosotros.",
                "Salmos 46:1 - Dios es nuestro amparo.", "Hebreos 11:1 - La fe es la certeza.", "Santiago 1:5 - Sabiduría de Dios.",
                "1 Pedro 5:7 - Echando toda ansiedad.", "Mateo 6:33 - Buscad primeramente el reino.", "Proverbios 4:23 - Guarda tu corazón.",
                "Salmos 119:105 - Lámpara es a mis pies.", "Isaías 54:17 - Ninguna arma forjada.", "Romanos 12:2 - Transformaos.",
                "Filipenses 4:6 - Por nada estéis afanosos.", "Salmos 34:8 - Gustad y ved que es bueno Jehová.", "Juan 14:6 - Yo soy el camino."
            ];
            versiculos.forEach(v => add('Bíblico', `Hola {NOMBRE}, hoy meditaba en ${v}. ¡Espero que fortalezca tu espíritu!`));

            // 30 Ánimo
            for(let i=1; i<=30; i++) add('Ánimo', `Hola {NOMBRE}, solo quería recordarte que eres un pilar importante en nuestra iglesia (Mensaje de ánimo #${i}). ¡No te rindas!`);
            
            // 20 Familia
            for(let i=1; i<=20; i++) add('Familia', `Bendiciones {NOMBRE}, ¿cómo está tu familia? Oramos para que la paz de Dios reine en tu hogar hoy.`);
            
            // 20 Seguimiento/Faltas
            for(let i=1; i<=20; i++) add('Seguimiento', `Hola {NOMBRE}, te extrañamos en la última reunión. Espero que todo esté bien. ¡Un abrazo!`);
            
            // 15 Cumpleaños
            for(let i=1; i<=15; i++) add('Cumpleaños', `¡Feliz cumpleaños {NOMBRE}! Damos gracias a Dios por un año más de tu vida. Salmo 139.`);
            
            // 15 Enfermedad/Salud
            for(let i=1; i<=15; i++) add('Salud', `{NOMBRE}, supe que estás pasando por un tema de salud. Declaramos sanidad sobre tu cuerpo en el nombre de Jesús.`);
            
            // 15 Liderazgo
            for(let i=1; i<=15; i++) add('Liderazgo', `Gracias {NOMBRE} por tu servicio y liderazgo. Tu trabajo en el Señor no es en vano.`);
            
            // 15 General/Agradecimiento
            for(let i=1; i<=15; i++) add('General', `Saludos {NOMBRE}, deseando que tengas una semana llena de victorias.`);

            return msgs;
        }

        // --- 2. DATA STORE ---
        const store = {
            data: null,
            
            load() {
                const raw = localStorage.getItem(DB_NAME);
                if (raw) {
                    this.data = JSON.parse(raw);
                    // Migración simple si faltan campos
                    if (!this.data.messages || this.data.messages.length < 10) {
                        this.data.messages = generateSeedMessages();
                        this.save();
                    }
                } else {
                    this.data = SEED_DATA;
                    this.data.messages = generateSeedMessages();
                    this.save();
                }
            },

            save() {
                localStorage.setItem(DB_NAME, JSON.stringify(this.data));
            },

            // Métodos CRUD
            addMember(m) { this.data.members.push(m); this.save(); },
            updateMember(m) { const idx = this.data.members.findIndex(x=>x.id==m.id); if(idx>=0) this.data.members[idx]=m; this.save(); },
            deleteMember(id) { this.data.members = this.data.members.filter(x=>x.id!==id); this.save(); },
            
            addGroup(name) { this.data.groups.push({id: 'g_'+Date.now(), name}); this.save(); },
            deleteGroup(id) { this.data.groups = this.data.groups.filter(x=>x.id!==id); this.save(); },
            
            addMsg(msg) { this.data.messages.push(msg); this.save(); },
            updateMsg(msg) { const idx = this.data.messages.findIndex(x=>x.id==msg.id); if(idx>=0) this.data.messages[idx]=msg; this.save(); },
            deleteMsg(id) { this.data.messages = this.data.messages.filter(x=>x.id!==id); this.save(); }
        };

        // --- 3. APP CONTROLLER ---
        const app = {
            view: 'dashboard',
            
            init() {
                store.load();
                this.navigate('dashboard');
                
                // Detectar instalación
                if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
                    console.log('Running in App Mode');
                }
            },

            navigate(viewName) {
                this.view = viewName;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                
                const navMap = {'dashboard':0, 'members':1, 'messages':2, 'groups':3};
                if(navMap[viewName] !== undefined) document.querySelectorAll('.nav-btn')[navMap[viewName]].classList.add('active');

                // Toggle FAB
                const fab = document.getElementById('fab');
                fab.style.display = (viewName === 'members' || viewName === 'messages') ? 'flex' : 'none';

                this.render();
            },

            handleFab() {
                if (this.view === 'members') this.openMemberModal();
                if (this.view === 'messages') this.openMessageModal();
            },

            render() {
                const container = document.getElementById('app-view');
                container.innerHTML = ''; // Clear

                switch(this.view) {
                    case 'dashboard': this.renderDashboard(container); break;
                    case 'members': this.renderMembers(container); break;
                    case 'messages': this.renderMessages(container); break;
                    case 'groups': this.renderGroups(container); break;
                }
            },

            // --- VISTAS ---

            renderDashboard(container) {
                // Lógica del "Buen Pastor" (Quién necesita contacto)
                const now = new Date();
                const dueMembers = store.data.members
                    .map(m => {
                        const last = new Date(m.lastContact || 0);
                        const daysAgo = Math.floor((now - last)/(1000*60*60*24));
                        const urgency = daysAgo / m.freq; // >1 es urgente
                        return {...m, daysAgo, urgency};
                    })
                    .sort((a,b) => b.urgency - a.urgency)
                    .slice(0, 5); // Top 5

                let html = `
                    <div class="card" style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color:white; border:none;">
                        <h2>👋 Hola Pastor</h2>
                        <p style="opacity:0.9">Hoy es un buen día para pastorear corazones.</p>
                        <div style="display:flex; gap:20px; margin-top:10px;">
                            <div><strong>${store.data.members.length}</strong><br><small>Ovejas</small></div>
                            <div><strong>${store.data.messages.length}</strong><br><small>Mensajes</small></div>
                        </div>
                    </div>
                    <h3>Prioridad de Contacto</h3>
                `;

                if (dueMembers.length === 0) {
                    html += `<div class="card text-center text-muted">Todo el rebaño está al día. ¡Descansa!</div>`;
                } else {
                    dueMembers.forEach(m => {
                        html += `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong>${m.name}</strong><br>
                                <small class="tag ${m.urgency > 1.2 ? 'tag-red' : 'tag-blue'}">Hace ${m.daysAgo} días</small>
                                <small style="color:var(--text-muted)"> • ${store.data.groups.find(g=>g.id===m.groupId)?.name || 'General'}</small>
                            </div>
                            <button class="btn btn-primary btn-sm" onclick="app.contactFlow('${m.id}')">Contactar</button>
                        </div>`;
                    });
                }
                container.innerHTML = html;
            },

            renderMembers(container) {
                let html = `<input type="text" placeholder="🔍 Buscar oveja..." onkeyup="app.filterList(this, '.member-card')">`;
                
                if (store.data.members.length === 0) {
                    html += `<div style="text-align:center; padding:2rem; color:var(--text-muted)">No hay miembros aún.<br>Toca el botón + para añadir.</div>`;
                }

                store.data.members.sort((a,b) => a.name.localeCompare(b.name)).forEach(m => {
                    const gName = store.data.groups.find(g=>g.id===m.groupId)?.name || '?';
                    html += `
                    <div class="list-item member-card" onclick="app.openMemberModal('${m.id}')">
                        <div>
                            <div style="font-weight:600; font-size:1.05rem;">${m.name}</div>
                            <div style="font-size:0.85rem; color:var(--text-muted);">${gName}</div>
                        </div>
                        <div style="color:var(--primary)">✎</div>
                    </div>`;
                });
                container.innerHTML = html;
            },

            renderMessages(container) {
                // Filtro Categorías
                const cats = [...new Set(store.data.messages.map(m => m.cat))];
                let html = `
                    <div class="tabs">
                        <button class="tab active" onclick="app.filterMsgs('all', this)">Todos</button>
                        ${cats.map(c => `<button class="tab" onclick="app.filterMsgs('${c}', this)">${c}</button>`).join('')}
                    </div>
                    <input type="text" placeholder="🔍 Buscar texto..." onkeyup="app.filterList(this, '.msg-card')">
                    <div id="msg-list">
                `;

                store.data.messages.forEach(m => {
                    html += `
                    <div class="card msg-card" data-cat="${m.cat}" onclick="app.openMessageModal('${m.id}')">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span class="tag tag-blue">${m.cat}</span>
                        </div>
                        <div style="font-style:italic; color:var(--text-muted)">"${m.text.substring(0, 60)}..."</div>
                    </div>`;
                });
                html += '</div>';
                container.innerHTML = html;
            },

            renderGroups(container) {
                let html = `
                    <div class="card">
                        <h3>Gestión de Grupos</h3>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="new-group-name" placeholder="Nuevo grupo..." style="margin:0;">
                            <button class="btn btn-primary btn-sm" onclick="app.addGroupAction()">+</button>
                        </div>
                    </div>
                `;
                store.data.groups.forEach(g => {
                    const count = store.data.members.filter(m => m.groupId === g.id).length;
                    html += `
                    <div class="list-item">
                        <span>${g.name} <span class="tag tag-green">${count}</span></span>
                        ${count === 0 ? `<button class="btn-sm btn-danger" onclick="store.deleteGroup('${g.id}'); app.render();">Borrar</button>` : ''}
                    </div>`;
                });
                container.innerHTML = html;
            },

            // --- UTILS ---
            filterList(input, selector) {
                const term = input.value.toLowerCase();
                document.querySelectorAll(selector).forEach(el => {
                    el.style.display = el.innerText.toLowerCase().includes(term) ? 'block' : 'none';
                });
            },

            filterMsgs(cat, btn) {
                document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.msg-card').forEach(el => {
                    el.style.display = (cat === 'all' || el.dataset.cat === cat) ? 'block' : 'none';
                });
            },

            // --- MODALS & ACTIONS ---

            openMemberModal(id = null) {
                const m = id ? store.data.members.find(x => x.id === id) : { id: '', name: '', phone: '', groupId: store.data.groups[0]?.id, freq: 30, notes: '' };
                const isEdit = !!id;

                const groupOpts = store.data.groups.map(g => `<option value="${g.id}" ${m.groupId===g.id?'selected':''}>${g.name}</option>`).join('');

                const html = `
                    <form onsubmit="app.saveMember(event, '${isEdit ? m.id : ''}')">
                        <label>Nombre Completo</label>
                        <input type="text" name="name" value="${m.name}" required>
                        
                        <label>WhatsApp (Ej: 521234567890)</label>
                        <input type="tel" name="phone" value="${m.phone}" required>
                        
                        <label>Grupo Celular</label>
                        <select name="groupId">${groupOpts}</select>
                        
                        <label>Frecuencia de Contacto (Días)</label>
                        <select name="freq">
                            <option value="7" ${m.freq==7?'selected':''}>Semanal (7)</option>
                            <option value="15" ${m.freq==15?'selected':''}>Quincenal (15)</option>
                            <option value="30" ${m.freq==30?'selected':''}>Mensual (30)</option>
                            <option value="60" ${m.freq==60?'selected':''}>Bimestral (60)</option>
                        </select>

                        <label>Notas</label>
                        <textarea name="notes">${m.notes}</textarea>

                        <button type="submit" class="btn btn-primary">${isEdit ? 'Guardar Cambios' : 'Registrar Oveja'}</button>
                        ${isEdit ? `<button type="button" onclick="app.deleteMemberAction('${m.id}')" class="btn btn-danger" style="margin-top:10px;">Eliminar</button>` : ''}
                    </form>
                `;
                this.showModal(isEdit ? 'Editar Miembro' : 'Nuevo Miembro', html);
            },

            saveMember(e, id) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const obj = {
                    id: id || 'mem_'+Date.now(),
                    name: formData.get('name'),
                    phone: formData.get('phone').replace(/[^0-9]/g, ''),
                    groupId: formData.get('groupId'),
                    freq: parseInt(formData.get('freq')),
                    notes: formData.get('notes'),
                    lastContact: id ? store.data.members.find(x=>x.id===id).lastContact : null
                };
                
                if (id) store.updateMember(obj);
                else store.addMember(obj);
                
                this.closeModal();
                this.render();
            },

            deleteMemberAction(id) {
                if(confirm('¿Seguro que deseas eliminar a este miembro?')) {
                    store.deleteMember(id);
                    this.closeModal();
                    this.render();
                }
            },

            addGroupAction() {
                const name = document.getElementById('new-group-name').value;
                if(name) {
                    store.addGroup(name);
                    this.render();
                }
            },

            openMessageModal(id = null) {
                const m = id ? store.data.messages.find(x => x.id === id) : { id: '', cat: 'General', text: '' };
                const isEdit = !!id;
                
                // Categorías únicas existentes + algunas por defecto
                const baseCats = ['Bíblico', 'Ánimo', 'Familia', 'Cumpleaños', 'Seguimiento', 'Salud', 'General'];
                const allCats = [...new Set([...baseCats, ...store.data.messages.map(x=>x.cat)])];
                
                const html = `
                    <form onsubmit="app.saveMessage(event, '${isEdit ? m.id : ''}')">
                        <label>Categoría</label>
                        <input list="cats" name="cat" value="${m.cat}" required>
                        <datalist id="cats">${allCats.map(c=>`<option value="${c}">`).join('')}</datalist>

                        <label>Mensaje (Usa {NOMBRE} para insertar el nombre)</label>
                        <textarea name="text" rows="5" required>${m.text}</textarea>

                        <button type="submit" class="btn btn-primary">${isEdit ? 'Guardar' : 'Crear'}</button>
                        ${isEdit ? `<button type="button" onclick="app.deleteMsgAction('${m.id}')" class="btn btn-danger" style="margin-top:10px;">Eliminar</button>` : ''}
                    </form>
                `;
                this.showModal(isEdit ? 'Editar Maná' : 'Nuevo Mensaje', html);
            },

            saveMessage(e, id) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const obj = {
                    id: id || 'msg_'+Date.now(),
                    cat: formData.get('cat'),
                    text: formData.get('text')
                };
                if(id) store.updateMsg(obj);
                else store.addMsg(obj);
                this.closeModal();
                this.render();
            },

            deleteMsgAction(id) {
                if(confirm('¿Borrar mensaje?')) {
                    store.deleteMsg(id);
                    this.closeModal();
                    this.render();
                }
            },

            // --- FLUJO DE CONTACTO ---
            contactFlow(memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                
                // Seleccionar mensaje aleatorio de categoría relevante
                // O dejar al usuario elegir categoría
                const cats = [...new Set(store.data.messages.map(msg => msg.cat))];
                
                const html = `
                    <p>Vas a escribirle a <strong>${m.name}</strong>.</p>
                    <label>Elige una temática:</label>
                    <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px;">
                        ${cats.map(c => `<span class="tag tag-blue" style="cursor:pointer; padding:8px;" onclick="app.loadRandomMsg('${c}', '${m.id}')">${c}</span>`).join('')}
                    </div>
                    
                    <textarea id="final-msg" rows="6"></textarea>
                    
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-outline" onclick="app.loadRandomMsg(null, '${m.id}')">🔄 Otro</button>
                        <button class="btn btn-success" onclick="app.sendWhatsApp('${m.id}')">Enviar WhatsApp</button>
                    </div>
                `;
                this.showModal('Enviar Mensaje', html);
                this.loadRandomMsg('Bíblico', m.id); // Default
            },

            loadRandomMsg(cat, memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                const pool = cat 
                    ? store.data.messages.filter(msg => msg.cat === cat)
                    : store.data.messages;
                
                if (pool.length === 0) return;
                
                const randomMsg = pool[Math.floor(Math.random() * pool.length)];
                const finalText = randomMsg.text.replace(/{NOMBRE}/g, m.name.split(' ')[0]);
                
                document.getElementById('final-msg').value = finalText;
            },

            sendWhatsApp(memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                const text = document.getElementById('final-msg').value;
                const url = `https://wa.me/${m.phone}?text=${encodeURIComponent(text)}`;
                
                // Update Last Contact
                m.lastContact = new Date().toISOString();
                store.updateMember(m);
                
                window.open(url, '_blank');
                this.closeModal();
                this.render(); // Refrescar dashboard
            },

            showSettings() {
                const html = `
                    <h3>Configuración</h3>
                    <button class="btn btn-outline" onclick="app.backupData()">⬇️ Descargar Copia de Seguridad</button>
                    <button class="btn btn-outline" onclick="document.getElementById('file-input').click()" style="margin-top:10px;">⬆️ Restaurar Copia</button>
                    <input type="file" id="file-input" class="hidden" onchange="app.restoreData(this)">
                    
                    <hr style="margin:20px 0; border:0; border-top:1px solid var(--border);">
                    
                    <h3>Instalación</h3>
                    <p style="font-size:0.9rem; color:var(--text-muted);">
                        Esta aplicación funciona mejor si la instalas en tu móvil:
                        <br><br>
                        <strong>Android (Chrome):</strong> Menú > Instalar aplicación.<br>
                        <strong>iPhone (Safari):</strong> Compartir > Agregar al inicio.
                    </p>
                `;
                this.showModal('Ajustes', html);
            },

            backupData() {
                const str = JSON.stringify(store.data);
                const blob = new Blob([str], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pastoral_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            },

            restoreData(input) {
                const file = input.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        if(json.members && json.messages) {
                            store.data = json;
                            store.save();
                            alert('Datos restaurados con éxito');
                            location.reload();
                        } else {
                            alert('Archivo inválido');
                        }
                    } catch(err) { alert('Error al leer el archivo'); }
                };
                reader.readAsText(file);
            },

            // --- GENERIC MODAL UI ---
            showModal(title, content) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerHTML = content;
                document.getElementById('modal').classList.add('open');
            },
            closeModal() {
                document.getElementById('modal').classList.remove('open');
            }
        };

        // Start
        app.init();

    </script>
</body>
</html>
