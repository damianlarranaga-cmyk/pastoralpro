<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PastoralFlow Ultimate</title>
    
    <!-- PWA MANIFEST INYECTADO (Data URI) -->
    <link rel="manifest" id="my-manifest-placeholder">
    
    <!-- Meta Tags para iOS y Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐑</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 style=%22background:white; padding:10px;%22><text y=%22.8em%22 font-size=%2280%22>🐑</text></svg>">

    <script>
        // GENERACIÓN DINÁMICA DEL MANIFEST PARA INSTALACIÓN
        const manifest = {
            "name": "PastoralFlow",
            "short_name": "PastoralFlow",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#F3F4F6",
            "theme_color": "#2563EB",
            "orientation": "portrait-primary",
            "icons": [{
                "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563EB%22/><text x=%2250%22 y=%2250%22 font-size=%2260%22 text-anchor=%22middle%22 dy=%22.35em%22>🐑</text></svg>",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#my-manifest-placeholder').setAttribute('href', manifestURL);
    </script>

    <style>
        /* * ===============================================
         * SYNTHWEAVER DESIGN SYSTEM 3.0 (Responsive & Touch)
         * ===============================================
         */
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --primary-light: #EFF6FF;
            --accent: #F59E0B;
            --success: #10B981;
            --danger: #EF4444;
            --surface: #FFFFFF;
            --background: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #1F2937;
                --background: #111827;
                --text-main: #F9FAFB;
                --text-muted: #9CA3AF;
                --border: #374151;
                --primary-light: #1e3a8a;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- LAYOUT --- */
        header {
            background: var(--surface);
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            box-shadow: var(--shadow);
            z-index: 20;
            display: flex; justify-content: space-between; align-items: center;
        }

        h1 { font-size: 1.25rem; margin: 0; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }

        #app-view {
            flex: 1; overflow-y: auto;
            padding: 1rem;
            padding-bottom: calc(90px + var(--safe-area-bottom));
            scroll-behavior: smooth;
        }

        /* --- NAVIGATION --- */
        nav {
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 0.5rem 0;
            padding-bottom: max(0.5rem, var(--safe-area-bottom));
            position: fixed; bottom: 0; width: 100%;
            z-index: 30;
        }

        .nav-btn {
            background: none; border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 25%; /* Touch target optimization */
        }
        .nav-btn svg { width: 24px; height: 24px; margin-bottom: 4px; }
        .nav-btn.active { color: var(--primary); font-weight: 600; }
        .nav-btn.active svg { fill: var(--primary-light); }

        /* --- COMPONENTS --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem; margin-bottom: 1rem;
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn {
            padding: 0.8rem 1rem;
            border-radius: 8px; font-weight: 600;
            border: none; cursor: pointer;
            width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-size: 1rem; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; }

        .fab {
            position: fixed; bottom: calc(90px + var(--safe-area-bottom)); right: 20px;
            width: 56px; height: 56px;
            background: var(--primary); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            z-index: 25; border: none; cursor: pointer;
        }

        /* --- FORMS & INPUTS --- */
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-wrapper { display: flex; gap: 8px; }
        
        input, select, textarea {
            width: 100%; padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-main);
            font-size: 16px; /* Important for iOS zoom prevention */
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }

        /* Contact Picker Button Specifics */
        .btn-contact-picker {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0 15px;
            white-space: nowrap;
        }

        /* --- LISTS --- */
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px; border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .list-item:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
        .list-item:last-child { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); border-bottom: none; }
        
        .tag { padding: 3px 8px; border-radius: 100px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .tag-red { background: #FEE2E2; color: var(--danger); }
        .tag-green { background: #D1FAE5; color: var(--success); }
        .tag-blue { background: var(--primary-light); color: var(--primary); }

        /* --- TABS --- */
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
        .tab { white-space: nowrap; padding: 8px 16px; border-radius: 20px; background: var(--border); font-size: 0.9rem; border: none; color: var(--text-muted); cursor: pointer; }
        .tab.active { background: var(--text-main); color: var(--surface); }

        /* --- MODAL --- */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 100;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--surface);
            width: 95%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
            border-radius: var(--radius);
            padding: 1.5rem;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none !important; }

        /* PC Optimization: Grid for larger screens */
        @media (min-width: 768px) {
            #app-view { max-width: 800px; margin: 0 auto; }
            .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
            nav { max-width: 800px; left: 50%; transform: translateX(-50%); border-radius: 12px 12px 0 0; border: 1px solid var(--border); border-bottom: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 3v18"></path><path d="M12 8l4.2 2.8a2.1 2.1 0 0 1 0 3.6L12 17"></path></svg>
            PastoralFlow
        </h1>
        <button class="btn-sm btn-outline" onclick="app.showSettings()">⚙️</button>
    </header>

    <div id="app-view">
        <!-- Contenido Dinámico -->
    </div>

    <!-- FAB -->
    <button id="fab" class="fab" onclick="app.handleFab()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <nav>
        <button class="nav-btn active" onclick="app.navigate('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Hoy
        </button>
        <button class="nav-btn" onclick="app.navigate('members')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Ovejas
        </button>
        <button class="nav-btn" onclick="app.navigate('messages')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Maná
        </button>
        <button class="nav-btn" onclick="app.navigate('groups')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            Grupos
        </button>
    </nav>

    <!-- GENERIC MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem; align-items: center;">
                <h2 id="modal-title" style="margin:0; font-size: 1.25rem;">Título</h2>
                <button onclick="app.closeModal()" style="background:none; border:none; font-size:1.5rem; color: var(--text-muted); padding: 5px;">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        /**
         * PASTORAL FLOW CORE ENGINE v3.0
         * - PWA Integration
         * - Contact Picker API
         * - CMS Logic
         */
        
        const DB_NAME = 'pastoralflow_ultimate_db';
        
        // --- 1. SEED DATA GENERATOR ---
        function generateSeedMessages() {
            const msgs = [];
            const add = (cat, text) => msgs.push({ id: 'msg_'+Date.now()+Math.random(), cat, text });

            // Generador masivo de mensajes (160+)
            const verses = [
                "Josué 1:9", "Filipenses 4:13", "Salmos 23:1", "Isaías 40:31", "Romanos 8:28", 
                "Salmos 91:1", "Proverbios 3:5", "Mateo 11:28", "Salmos 121:1", "Isaías 41:10",
                "Jeremías 29:11", "Salmos 37:4", "Juan 3:16", "Efesios 2:8", "Gálatas 2:20"
            ];
            
            // Bíblicos
            verses.forEach((v, i) => add('Bíblico', `Hola {NOMBRE}, medita hoy en ${v}. Dios tiene el control.`));
            for(let i=0; i<15; i++) add('Bíblico', `Bendiciones {NOMBRE}, recuerda que Dios es fiel. (Ref #${i+1})`);

            // Ánimo
            for(let i=0; i<30; i++) add('Ánimo', `¡Ánimo {NOMBRE}! Eres importante para el Reino y para nosotros. Sigue adelante. (Mensaje ${i+1})`);
            
            // Familia
            for(let i=0; i<25; i++) add('Familia', `Hola {NOMBRE}, oramos por tu casa y tu familia hoy. Que la paz de Dios reine en tu hogar.`);
            
            // Seguimiento
            for(let i=0; i<25; i++) add('Seguimiento', `Hola {NOMBRE}, ¿cómo has estado? Te extrañamos y queríamos saludarte.`);
            
            // Cumpleaños
            for(let i=0; i<15; i++) add('Cumpleaños', `¡Feliz Cumpleaños {NOMBRE}! Que Dios te conceda muchos años más llenos de propósito.`);
            
            // Salud
            for(let i=0; i<15; i++) add('Salud', `{NOMBRE}, declaramos sanidad y fortaleza sobre tu cuerpo en el nombre de Jesús.`);
            
            // General
            for(let i=0; i<20; i++) add('General', `Saludos {NOMBRE}, deseando que tengas una semana llena de victorias en Cristo.`);

            return msgs;
        }

        const SEED_GROUPS = [
            { id: 'g1', name: 'Jóvenes' }, { id: 'g2', name: 'Matrimonios' },
            { id: 'g3', name: 'Damas' }, { id: 'g4', name: 'Varones' },
            { id: 'g5', name: 'Liderazgo' }, { id: 'g6', name: 'Consolidación' },
            { id: 'g7', name: 'General' }
        ];

        // --- 2. DATA STORE ---
        const store = {
            data: null,
            load() {
                const raw = localStorage.getItem(DB_NAME);
                if (raw) {
                    this.data = JSON.parse(raw);
                    // Integridad de datos
                    if(!this.data.messages || this.data.messages.length < 10) this.data.messages = generateSeedMessages();
                    if(!this.data.groups) this.data.groups = SEED_GROUPS;
                } else {
                    this.data = { members: [], groups: SEED_GROUPS, messages: generateSeedMessages() };
                    this.save();
                }
            },
            save() { localStorage.setItem(DB_NAME, JSON.stringify(this.data)); },
            
            // CRUD
            addMember(m) { this.data.members.push(m); this.save(); },
            updateMember(m) { const idx = this.data.members.findIndex(x=>x.id==m.id); if(idx>=0) this.data.members[idx]=m; this.save(); },
            deleteMember(id) { this.data.members = this.data.members.filter(x=>x.id!==id); this.save(); },
            addGroup(name) { this.data.groups.push({id: 'g_'+Date.now(), name}); this.save(); },
            deleteGroup(id) { this.data.groups = this.data.groups.filter(x=>x.id!==id); this.save(); },
            addMsg(msg) { this.data.messages.push(msg); this.save(); },
            updateMsg(msg) { const idx = this.data.messages.findIndex(x=>x.id==msg.id); if(idx>=0) this.data.messages[idx]=msg; this.save(); },
            deleteMsg(id) { this.data.messages = this.data.messages.filter(x=>x.id!==id); this.save(); }
        };

        // --- 3. APP CONTROLLER ---
        const app = {
            view: 'dashboard',
            
            init() {
                store.load();
                this.navigate('dashboard');
                // Check Contact Picker Support
                this.hasContactPicker = ('contacts' in navigator && 'ContactsManager' in window);
            },

            navigate(viewName) {
                this.view = viewName;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                
                const navMap = {'dashboard':0, 'members':1, 'messages':2, 'groups':3};
                if(navMap[viewName] !== undefined) document.querySelectorAll('.nav-btn')[navMap[viewName]].classList.add('active');

                document.getElementById('fab').style.display = (viewName === 'members' || viewName === 'messages') ? 'flex' : 'none';
                this.render();
            },

            handleFab() {
                if (this.view === 'members') this.openMemberModal();
                if (this.view === 'messages') this.openMessageModal();
            },

            render() {
                const container = document.getElementById('app-view');
                container.innerHTML = ''; 

                switch(this.view) {
                    case 'dashboard': this.renderDashboard(container); break;
                    case 'members': this.renderMembers(container); break;
                    case 'messages': this.renderMessages(container); break;
                    case 'groups': this.renderGroups(container); break;
                }
            },

            // --- VISTA DASHBOARD ---
            renderDashboard(container) {
                const now = new Date();
                const dueMembers = store.data.members
                    .map(m => {
                        const last = new Date(m.lastContact || 0);
                        const daysAgo = Math.floor((now - last)/(1000*60*60*24));
                        const urgency = daysAgo / m.freq; 
                        return {...m, daysAgo, urgency};
                    })
                    .sort((a,b) => b.urgency - a.urgency)
                    .slice(0, 5); // Top 5

                let html = `
                    <div class="card" style="background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color:white; border:none;">
                        <h2>👋 Panel Pastoral</h2>
                        <p style="opacity:0.9; margin-top:5px;">${store.data.members.length} ovejas bajo cuidado.</p>
                        <div style="display:flex; gap:10px; margin-top:15px;">
                             <div style="background:rgba(255,255,255,0.2); padding:5px 10px; border-radius:8px;">
                                <small>Hoy</small><br><strong>${new Date().toLocaleDateString()}</strong>
                             </div>
                        </div>
                    </div>
                    <h3>Requieren Atención</h3>
                `;

                if (dueMembers.length === 0) {
                    html += `<div class="card text-center text-muted" style="padding:2rem;">¡Aleluya! Todo el rebaño está al día.</div>`;
                } else {
                    html += `<div class="dashboard-grid">`;
                    dueMembers.forEach(m => {
                        html += `
                        <div class="card" style="border-left: 4px solid ${m.urgency > 1.2 ? 'var(--danger)' : 'var(--accent)'};">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div>
                                    <strong>${m.name}</strong>
                                    <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">
                                        ${store.data.groups.find(g=>g.id===m.groupId)?.name || 'General'}
                                    </div>
                                    <span class="tag ${m.urgency > 1.2 ? 'tag-red' : 'tag-blue'}" style="margin-top:5px; display:inline-block;">Hace ${m.daysAgo} días</span>
                                </div>
                                <button class="btn btn-primary btn-sm" onclick="app.contactFlow('${m.id}')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                </button>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                container.innerHTML = html;
            },

            // --- VISTA MIEMBROS ---
            renderMembers(container) {
                store.data.members.sort((a,b) => a.name.localeCompare(b.name));
                let html = `<input type="text" placeholder="🔍 Buscar oveja..." onkeyup="app.filterList(this, '.member-card')">`;
                
                if (store.data.members.length === 0) {
                    html += `<div style="text-align:center; padding:3rem; color:var(--text-muted)">El libro está vacío.<br>Usa el botón + para añadir.</div>`;
                }

                html += '<div class="member-list">';
                store.data.members.forEach(m => {
                    const gName = store.data.groups.find(g=>g.id===m.groupId)?.name || '?';
                    html += `
                    <div class="list-item member-card" onclick="app.openMemberModal('${m.id}')">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:40px; height:40px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${m.name.charAt(0)}</div>
                            <div>
                                <div style="font-weight:600;">${m.name}</div>
                                <div style="font-size:0.85rem; color:var(--text-muted);">${gName}</div>
                            </div>
                        </div>
                        <div style="color:var(--text-muted)">›</div>
                    </div>`;
                });
                html += '</div>';
                container.innerHTML = html;
            },

            // --- VISTA MENSAJES ---
            renderMessages(container) {
                const cats = [...new Set(store.data.messages.map(m => m.cat))];
                let html = `
                    <div class="tabs">
                        <button class="tab active" onclick="app.filterMsgs('all', this)">Todos</button>
                        ${cats.map(c => `<button class="tab" onclick="app.filterMsgs('${c}', this)">${c}</button>`).join('')}
                    </div>
                    <input type="text" placeholder="🔍 Buscar texto..." onkeyup="app.filterList(this, '.msg-card')">
                    <div id="msg-list">
                `;

                store.data.messages.forEach(m => {
                    html += `
                    <div class="card msg-card" data-cat="${m.cat}" onclick="app.openMessageModal('${m.id}')">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span class="tag tag-blue">${m.cat}</span>
                        </div>
                        <div style="font-style:italic; color:var(--text-muted); line-height:1.4;">"${m.text.substring(0, 80)}..."</div>
                    </div>`;
                });
                html += '</div>';
                container.innerHTML = html;
            },

            // --- VISTA GRUPOS ---
            renderGroups(container) {
                let html = `
                    <div class="card">
                        <h3>Nuevo Grupo</h3>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="new-group-name" placeholder="Nombre (Ej: Danza)..." style="margin:0;">
                            <button class="btn btn-primary" style="width:auto;" onclick="app.addGroupAction()">+</button>
                        </div>
                    </div>
                    <h3>Grupos Actuales</h3>
                `;
                store.data.groups.forEach(g => {
                    const count = store.data.members.filter(m => m.groupId === g.id).length;
                    html += `
                    <div class="list-item">
                        <span style="font-weight:500;">${g.name} <span class="tag tag-green" style="margin-left:5px;">${count}</span></span>
                        ${count === 0 ? `<button class="btn-sm btn-danger" onclick="store.deleteGroup('${g.id}'); app.render();">Eliminar</button>` : ''}
                    </div>`;
                });
                container.innerHTML = html;
            },

            // --- HELPERS ---
            filterList(input, selector) {
                const term = input.value.toLowerCase();
                document.querySelectorAll(selector).forEach(el => {
                    el.style.display = el.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
                });
            },
            filterMsgs(cat, btn) {
                document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.msg-card').forEach(el => {
                    const elCat = el.getAttribute('data-cat');
                    el.style.display = (cat === 'all' || elCat === cat) ? 'block' : 'none';
                });
            },

            // --- MODALS & LOGIC ---
            
            // >>> FUNCIÓN CONTACT PICKER <<<
            async pickContact() {
                if (!this.hasContactPicker) return;
                
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);
                    
                    if (contacts.length) {
                        const contact = contacts[0];
                        // Asignar Nombre
                        if (contact.name && contact.name.length) {
                            document.querySelector('input[name="name"]').value = contact.name[0];
                        }
                        // Asignar Teléfono (Limpieza)
                        if (contact.tel && contact.tel.length) {
                            const raw = contact.tel[0];
                            const clean = raw.replace(/[^0-9]/g, ''); // Solo números
                            document.querySelector('input[name="phone"]').value = clean;
                        }
                    }
                } catch (ex) {
                    console.log("Picker cancelado o error", ex);
                }
            },

            openMemberModal(id = null) {
                const m = id ? store.data.members.find(x => x.id === id) : { id: '', name: '', phone: '', groupId: store.data.groups[0]?.id, freq: 30, notes: '' };
                const isEdit = !!id;
                const groupOpts = store.data.groups.map(g => `<option value="${g.id}" ${m.groupId===g.id?'selected':''}>${g.name}</option>`).join('');
                
                // Botón de Contact Picker solo si es soportado
                const pickerBtn = this.hasContactPicker 
                    ? `<button type="button" class="btn btn-contact-picker" onclick="app.pickContact()">📒 Agenda</button>` 
                    : '';

                const html = `
                    <form onsubmit="app.saveMember(event, '${isEdit ? m.id : ''}')">
                        <div class="input-group">
                            <label>Nombre Completo</label>
                            <input type="text" name="name" value="${m.name}" required placeholder="Hno. Juan Pérez">
                        </div>
                        
                        <div class="input-group">
                            <label>WhatsApp (Sin símbolos)</label>
                            <div class="input-wrapper">
                                <input type="tel" name="phone" value="${m.phone}" required placeholder="521555555555">
                                ${pickerBtn}
                            </div>
                            <small style="color:var(--text-muted); font-size:0.75rem;">Incluye código de país.</small>
                        </div>
                        
                        <div class="input-group">
                            <label>Grupo Celular</label>
                            <select name="groupId">${groupOpts}</select>
                        </div>
                        
                        <div class="input-group">
                            <label>Frecuencia de Contacto</label>
                            <select name="freq">
                                <option value="7" ${m.freq==7?'selected':''}>Semanal (Líderes)</option>
                                <option value="15" ${m.freq==15?'selected':''}>Quincenal (Cercanos)</option>
                                <option value="30" ${m.freq==30?'selected':''}>Mensual (Estándar)</option>
                                <option value="60" ${m.freq==60?'selected':''}>Bimestral (Mantenimiento)</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Notas Pastorales</label>
                            <textarea name="notes" rows="3">${m.notes}</textarea>
                        </div>

                        <div style="display:flex; gap:10px; margin-top:20px;">
                            ${isEdit ? `<button type="button" onclick="app.deleteMemberAction('${m.id}')" class="btn btn-danger" style="width:auto;">🗑️</button>` : ''}
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                `;
                this.showModal(isEdit ? 'Editar Oveja' : 'Nueva Oveja', html);
            },

            saveMember(e, id) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const obj = {
                    id: id || 'mem_'+Date.now(),
                    name: formData.get('name'),
                    phone: formData.get('phone').replace(/[^0-9]/g, ''),
                    groupId: formData.get('groupId'),
                    freq: parseInt(formData.get('freq')),
                    notes: formData.get('notes'),
                    lastContact: id ? store.data.members.find(x=>x.id===id).lastContact : null
                };
                if (id) store.updateMember(obj); else store.addMember(obj);
                this.closeModal(); this.render();
            },

            deleteMemberAction(id) {
                if(confirm('¿Confirmas eliminar a este miembro?')) { store.deleteMember(id); this.closeModal(); this.render(); }
            },

            addGroupAction() {
                const name = document.getElementById('new-group-name').value;
                if(name) { store.addGroup(name); this.render(); }
            },

            openMessageModal(id = null) {
                const m = id ? store.data.messages.find(x => x.id === id) : { id: '', cat: 'General', text: '' };
                const isEdit = !!id;
                const baseCats = ['Bíblico', 'Ánimo', 'Familia', 'Cumpleaños', 'Seguimiento', 'Salud', 'General'];
                const allCats = [...new Set([...baseCats, ...store.data.messages.map(x=>x.cat)])];
                
                const html = `
                    <form onsubmit="app.saveMessage(event, '${isEdit ? m.id : ''}')">
                        <label>Categoría</label>
                        <input list="cats" name="cat" value="${m.cat}" required>
                        <datalist id="cats">${allCats.map(c=>`<option value="${c}">`).join('')}</datalist>

                        <label style="margin-top:1rem;">Mensaje</label>
                        <small style="color:var(--text-muted)">Usa <strong>{NOMBRE}</strong> para personalizar.</small>
                        <textarea name="text" rows="5" required style="margin-top:5px;">${m.text}</textarea>

                        <div style="display:flex; gap:10px; margin-top:20px;">
                             ${isEdit ? `<button type="button" onclick="app.deleteMsgAction('${m.id}')" class="btn btn-danger" style="width:auto;">🗑️</button>` : ''}
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                `;
                this.showModal(isEdit ? 'Editar Maná' : 'Nuevo Maná', html);
            },

            saveMessage(e, id) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const obj = { id: id || 'msg_'+Date.now(), cat: formData.get('cat'), text: formData.get('text') };
                if(id) store.updateMsg(obj); else store.addMsg(obj);
                this.closeModal(); this.render();
            },

            deleteMsgAction(id) {
                if(confirm('¿Borrar mensaje?')) { store.deleteMsg(id); this.closeModal(); this.render(); }
            },

            contactFlow(memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                const cats = [...new Set(store.data.messages.map(msg => msg.cat))];
                
                const html = `
                    <p>Contactando a <strong>${m.name}</strong></p>
                    <label>Selecciona tema:</label>
                    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; margin-top:5px;">
                        ${cats.map(c => `<span class="tag tag-blue" style="cursor:pointer; padding:8px 12px; font-size:0.8rem;" onclick="app.loadRandomMsg('${c}', '${m.id}')">${c}</span>`).join('')}
                    </div>
                    
                    <textarea id="final-msg" rows="6" style="font-family:sans-serif;"></textarea>
                    
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-outline" onclick="app.loadRandomMsg(null, '${m.id}')">🔄 Otro</button>
                        <button class="btn btn-success" onclick="app.sendWhatsApp('${m.id}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                             WhatsApp
                        </button>
                    </div>
                `;
                this.showModal('Enviar Mensaje', html);
                this.loadRandomMsg('Bíblico', m.id);
            },

            loadRandomMsg(cat, memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                const pool = cat ? store.data.messages.filter(msg => msg.cat === cat) : store.data.messages;
                if (pool.length === 0) return;
                const randomMsg = pool[Math.floor(Math.random() * pool.length)];
                const finalText = randomMsg.text.replace(/{NOMBRE}/g, m.name.split(' ')[0]);
                document.getElementById('final-msg').value = finalText;
            },

            sendWhatsApp(memberId) {
                const m = store.data.members.find(x => x.id === memberId);
                const text = document.getElementById('final-msg').value;
                const url = `https://wa.me/${m.phone}?text=${encodeURIComponent(text)}`;
                
                m.lastContact = new Date().toISOString();
                store.updateMember(m);
                
                window.open(url, '_blank');
                this.closeModal();
                this.render();
            },

            showSettings() {
                const html = `
                    <h3>Ajustes</h3>
                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <button class="btn btn-outline" onclick="app.backupData()">⬇️ Guardar Copia (Backup)</button>
                        <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">⬆️ Restaurar Copia</button>
                    </div>
                    <input type="file" id="file-input" class="hidden" onchange="app.restoreData(this)">
                    
                    <div style="background:var(--primary-light); padding:1rem; border-radius:8px; margin-top:20px; font-size:0.9rem;">
                        <strong>Para instalar:</strong><br>
                        📱 <strong>Android:</strong> Menú Chrome > "Instalar aplicación"<br>
                        🍎 <strong>iOS:</strong> Botón Compartir Safari > "Agregar al Inicio"<br>
                        💻 <strong>PC:</strong> Clic en el icono (+) en la barra de dirección.
                    </div>
                `;
                this.showModal('Configuración', html);
            },

            backupData() {
                const str = JSON.stringify(store.data);
                const blob = new Blob([str], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pastoral_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            },

            restoreData(input) {
                const file = input.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        if(json.members && json.messages) {
                            store.data = json; store.save(); alert('Restaurado con éxito'); location.reload();
                        } else alert('Archivo inválido');
                    } catch(err) { alert('Error al leer archivo'); }
                };
                reader.readAsText(file);
            },

            showModal(title, content) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerHTML = content;
                document.getElementById('modal').classList.add('open');
            },
            closeModal() { document.getElementById('modal').classList.remove('open'); }
        };

        app.init();
    </script>
</body>
</html>
